eta name="theme-color" content="#6366f1">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'%3E%3Cstop offset='0%' style='stop-color:%236366f1'/%3E%3Cstop offset='100%' style='stop-color:%239c34ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)' rx='20'/%3E%3Cpath d='M20,50L80,50M35,30L35,70M50,30L50,70M65,30L65,70' stroke='%23fff' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%23fff'/%3E%3Ccircle cx='32' cy='23' r='3' fill='%23fff'/%3E%3Ccircle cx='44' cy='18' r='2.5' fill='%23fff'/%3E%3C/svg%3E">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
    
    const Sparkles = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/>
        <path d="M19 12l.75 2.25L22 15l-2.25.75L19 18l-.75-2.25L16 15l2.25-.75L19 12z"/>
      </svg>
    );
    
    const Search = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    );
    
    const Image = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
      </svg>
    );
    
    const FileText = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
      </svg>
    );
    
    const Trash2 = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    );
    
    const Edit3 = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
    );
    
    const Coffee = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>
      </svg>
    );

    const App = () => {
      const [notes, setNotes] = useState([]);
      const [currentNote, setCurrentNote] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [editingId, setEditingId] = useState(null);

      useEffect(() => {
        loadNotes();
      }, []);

      const loadNotes = () => {
        const saved = localStorage.getItem('smartNotes');
        if (saved) {
          setNotes(JSON.parse(saved));
        }
      };

      const saveNotes = (newNotes) => {
        localStorage.setItem('smartNotes', JSON.stringify(newNotes));
        setNotes(newNotes);
      };

      const analyzeNote = (content) => {
        const words = content.trim().split(/\s+/);
        const sentences = content.split(/[.!?]+/).filter(s => s.trim());
        
        let title = '';
        if (sentences.length > 0) {
          const firstSentence = sentences[0].trim();
          title = firstSentence.length > 50 
            ? firstSentence.substring(0, 50) + '...'
            : firstSentence;
        } else {
          title = words.slice(0, 5).join(' ') + (words.length > 5 ? '...' : '');
        }

        const summary = sentences.length > 1
          ? sentences.slice(0, 2).join('. ') + '.'
          : content.length > 100
            ? content.substring(0, 100) + '...'
            : content;

        const keywords = [...new Set(
          words
            .filter(w => w.length > 4)
            .map(w => w.toLowerCase().replace(/[^a-zàâäéèêëïîôùûüÿç0-9]/g, ''))
            .filter(w => w)
        )].slice(0, 5);

        return { title, summary, keywords };
      };

      const saveNote = () => {
        if (!currentNote.trim()) return;

        setIsProcessing(true);
        
        setTimeout(() => {
          const analysis = analyzeNote(currentNote);
          
          let newNotes;
          if (editingId) {
            newNotes = notes.map(note => 
              note.id === editingId 
                ? { ...note, content: currentNote, ...analysis, timestamp: Date.now() }
                : note
            );
          } else {
            const noteData = {
              id: `note_${Date.now()}`,
              content: currentNote,
              title: analysis.title,
              summary: analysis.summary,
              keywords: analysis.keywords,
              timestamp: Date.now(),
              type: 'text'
            };
            newNotes = [noteData, ...notes];
          }

          saveNotes(newNotes);
          setCurrentNote('');
          setEditingId(null);
          setIsProcessing(false);
        }, 800);
      };

      const deleteNote = (id) => {
        saveNotes(notes.filter(note => note.id !== id));
      };

      const editNote = (note) => {
        setCurrentNote(note.content);
        setEditingId(note.id);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const filteredNotes = notes.filter(note => 
        note.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
        note.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
        note.keywords.some(k => k.includes(searchQuery.toLowerCase()))
      );

      return React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50' },
        React.createElement('div', { className: 'bg-white/80 backdrop-blur-lg border-b border-slate-200 sticky top-0 z-10' },
          React.createElement('div', { className: 'max-w-4xl mx-auto px-6 py-4' },
            React.createElement('div', { className: 'flex items-center justify-between' },
              React.createElement('div', { className: 'flex items-center gap-3' },
                React.createElement('div', { className: 'w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg' },
                  React.createElement(Sparkles)
                ),
                React.createElement('div', null,
                  React.createElement('h1', { className: 'text-xl font-bold text-slate-800' }, 'Smart Notes'),
                  React.createElement('p', { className: 'text-xs text-slate-500' }, 'Intelligence artificielle intégrée')
                )
              ),
              React.createElement('div', { className: 'text-sm text-slate-600 font-medium' },
                `${notes.length} note${notes.length !== 1 ? 's' : ''}`
              )
            )
          )
        ),

        React.createElement('div', { className: 'max-w-4xl mx-auto px-6 py-8' },
          React.createElement('div', { className: 'bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden mb-8' },
            React.createElement('div', { className: 'p-6' },
              React.createElement('textarea', {
                value: currentNote,
                onChange: (e) => setCurrentNote(e.target.value),
                placeholder: "Écrivez votre note ici... L'IA analysera et organisera automatiquement votre contenu.",
                className: 'w-full h-48 resize-none text-slate-700 placeholder-slate-400 focus:outline-none text-base leading-relaxed'
              })
            ),
            
            React.createElement('div', { className: 'border-t border-slate-100 bg-slate-50 px-6 py-4 flex items-center justify-between' },
              React.createElement('div', { className: 'flex gap-2' },
                React.createElement('button', { className: 'p-2 hover:bg-white rounded-lg transition-colors text-slate-400 hover:text-indigo-600' },
                  React.createElement(Image)
                ),
                React.createElement('button', { className: 'p-2 hover:bg-white rounded-lg transition-colors text-slate-400 hover:text-indigo-600' },
                  React.createElement(FileText)
                )
              ),
              
              React.createElement('button', {
                onClick: saveNote,
                disabled: !currentNote.trim() || isProcessing,
                className: 'flex items-center gap-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white px-6 py-2.5 rounded-xl font-medium shadow-lg hover:shadow-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed hover:scale-105'
              },
                React.createElement(Sparkles),
                isProcessing ? 'Analyse en cours...' : editingId ? 'Mettre à jour' : 'Sauvegarder'
              )
            )
          ),

          React.createElement('div', { className: 'mb-6' },
            React.createElement('div', { className: 'relative' },
              React.createElement('div', { className: 'absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400' },
                React.createElement(Search)
              ),
              React.createElement('input', {
                type: 'text',
                value: searchQuery,
                onChange: (e) => setSearchQuery(e.target.value),
                placeholder: 'Rechercher dans vos notes...',
                className: 'w-full pl-12 pr-4 py-3 bg-white rounded-xl border border-slate-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition-all'
              })
            )
          ),

          React.createElement('div', { className: 'space-y-4' },
            filteredNotes.length === 0 ? (
              React.createElement('div', { className: 'text-center py-16' },
                React.createElement('div', { className: 'w-16 h-16 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-2xl flex items-center justify-center mx-auto mb-4' },
                  React.createElement(Sparkles)
                ),
                React.createElement('p', { className: 'text-slate-500 text-lg' },
                  searchQuery ? 'Aucune note trouvée' : 'Créez votre première note intelligente'
                )
              )
            ) : (
              filteredNotes.map((note) =>
                React.createElement('div', {
                  key: note.id,
                  className: 'bg-white rounded-xl border border-slate-200 p-5 hover:shadow-lg transition-all group'
                },
                  React.createElement('div', { className: 'flex items-start justify-between gap-4' },
                    React.createElement('div', { className: 'flex-1 min-w-0' },
                      React.createElement('div', { className: 'flex items-center gap-2 mb-2' },
                        React.createElement('div', { className: 'text-indigo-500' }, React.createElement(Sparkles)),
                        React.createElement('h3', { className: 'font-semibold text-slate-800 truncate' }, note.title)
                      ),
                      React.createElement('p', { className: 'text-slate-600 text-sm mb-3 line-clamp-2' }, note.summary),
                      React.createElement('div', { className: 'flex items-center gap-2 flex-wrap' },
                        note.keywords.map((keyword, i) =>
                          React.createElement('span', {
                            key: i,
                            className: 'px-2 py-1 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-medium'
                          }, keyword)
                        )
                      ),
                      React.createElement('p', { className: 'text-xs text-slate-400 mt-3' },
                        new Date(note.timestamp).toLocaleDateString('fr-CA', {
                          year: 'numeric',
                          month: 'long',
                          day: 'numeric',
                          hour: '2-digit',
                          minute: '2-digit'
                        })
                      )
                    ),
                    
                    React.createElement('div', { className: 'flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity' },
                      React.createElement('button', {
                        onClick: () => editNote(note),
                        className: 'p-2 hover:bg-indigo-50 rounded-lg transition-colors text-indigo-600'
                      }, React.createElement(Edit3)),
                      React.createElement('button', {
                        onClick: () => deleteNote(note.id),
                        className: 'p-2 hover:bg-red-50 rounded-lg transition-colors text-red-600'
                      }, React.createElement(Trash2))
                    )
                  )
                )
              )
            )
          ),

          React.createElement('div', { className: 'mt-12 p-6 bg-white rounded-2xl border border-slate-200 text-center' },
            React.createElement('div', { className: 'flex items-center justify-center gap-2 mb-3' },
              React.createElement('div', { className: 'text-yellow-500' }, React.createElement(Coffee)),
              React.createElement('h3', { className: 'text-lg font-semibold text-slate-800' }, 'Vous aimez Smart Notes?')
            ),
            React.createElement('p', { className: 'text-slate-600 text-sm mb-4' },
              'Ce projet est gratuit et open source. Votre soutien aide à le maintenir et l\'améliorer!'
            ),
            React.createElement('div', { className: 'flex gap-3 justify-center flex-wrap' },
              React.createElement('a', {
                href: 'https://github.com/Blackandwhiteraccoon/smart-notes',
                target: '_blank',
                rel: 'noopener noreferrer',
                className: 'inline-flex items-center gap-2 px-4 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition-colors font-medium text-sm'
              }, '⭐ Star sur GitHub'),
              React.createElement('a', {
                href: 'https://buymeacoffee.com/yourusername',
                target: '_blank',
                rel: 'noopener noreferrer',
                className: 'inline-flex items-center gap-2 px-4 py-2 bg-yellow-400 text-yellow-900 rounded-lg hover:bg-yellow-500 transition-colors font-medium text-sm'
              },
                React.createElement(Coffee),
                'Offrir un café'
              )
            )
          )
        )
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
  
  <div class="min-h-screen">
    <!-- Header -->
    <div class="bg-white border-b border-slate-200 sticky top-0">
      <div class="max-w-4xl mx-auto px-6 py-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
            <span class="text-white text-2xl">✨</span>
          </div>
          <div>
            <h1 class="text-xl font-bold text-slate-800">Smart Notes</h1>
            <p class="text-xs text-slate-500">IA intégrée</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="max-w-4xl mx-auto px-6 py-8">
      
      <!-- Input -->
      <div class="bg-white rounded-2xl shadow-xl border mb-8">
        <textarea 
          id="note"
          placeholder="Écrivez votre note ici..."
          class="w-full h-48 p-6 rounded-t-2xl resize-none focus:outline-none"
        ></textarea>
        <div class="border-t bg-slate-50 px-6 py-4">
          <button 
            onclick="save()"
            class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white px-6 py-2.5 rounded-xl font-medium hover:shadow-lg"
          >
            ✨ Sauvegarder
          </button>
        </div>
      </div>

      <!-- Search -->
      <input 
        type="text"
        id="search"
        onkeyup="display()"
        placeholder="🔍 Rechercher..."
        class="w-full px-4 py-3 bg-white rounded-xl border mb-6 focus:border-indigo-400 focus:outline-none"
      >

      <!-- Notes -->
      <div id="list"></div>

    </div>
  </div>

  <script>
    let notes = JSON.parse(localStorage.getItem('notes') || '[]');

    function save() {
      const text = document.getElementById('note').value.trim();
      if (!text) return;

      const words = text.split(' ');
      const title = words.slice(0, 5).join(' ') + (words.length > 5 ? '...' : '');
      
      notes.unshift({
        id: Date.now(),
        text: text,
        title: title,
        date: new Date().toLocaleDateString('fr-CA')
      });

      localStorage.setItem('notes', JSON.stringify(notes));
      document.getElementById('note').value = '';
      display();
    }

    function display() {
      const search = document.getElementById('search').value.toLowerCase();
      const filtered = notes.filter(n => 
        n.text.toLowerCase().includes(search) || 
        n.title.toLowerCase().includes(search)
      );

      const html = filtered.length === 0 ? 
        '<div class="text-center py-16"><p class="text-slate-500 text-lg">Aucune note</p></div>' :
        filtered.map(n => `
          <div class="bg-white rounded-xl border p-5 mb-4 hover:shadow-lg transition">
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <h3 class="font-semibold text-slate-800 mb-2">✨ ${n.title}</h3>
                <p class="text-slate-600 text-sm mb-2">${n.text}</p>
                <p class="text-xs text-slate-400">${n.date}</p>
              </div>
              <button onclick="del(${n.id})" class="text-red-600 hover:bg-red-50 p-2 rounded">🗑️</button>
            </div>
          </div>
        `).join('');

      document.getElementById('list').innerHTML = html;
    }

    function del(id) {
      if (confirm('Supprimer?')) {
        notes = notes.filter(n => n.id !== id);
        localStorage.setItem('notes', JSON.stringify(notes));
        display();
      }
    }

    display();
  </script>

</body>
</html>
